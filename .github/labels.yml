# Canonical label taxonomy, synced to the repo by .github/workflows/labels-sync.yml
# (gh label, via the GitHub CLI). Edit here, not in the GitHub UI.

# --- type ---
- name: "type: bug"
  color: "d73a4a"
  description: "A defect in the extension, preset, scripts, or tests."
- name: "type: feature"
  color: "a2eeef"
  description: "A new capability or enhancement request."
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only."
- name: "type: question"
  color: "d876e3"
  description: "A question or support request."

# --- area ---
- name: "area: command"
  color: "5319e7"
  description: "Commands and hooks (fx-to-dotnet/commands/**)."
- name: "area: policy"
  color: "5319e7"
  description: "Migration policies (fx-to-dotnet/policies/**)."
- name: "area: script"
  color: "5319e7"
  description: "Shell/PowerShell scripts (scripts/** or support_scripts/**)."
- name: "area: manifest"
  color: "5319e7"
  description: "extension.yml / version manifest."
- name: "area: preset"
  color: "5319e7"
  description: "preset.yml and template overrides."
- name: "area: tests"
  color: "5319e7"
  description: "Test suite (tests/**)."
- name: "area: ci"
  color: "5319e7"
  description: "CI / release workflows."

# --- workflow ---
- name: "needs triage"
  color: "fbca04"
  description: "Awaiting maintainer review and labeling."
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers."
- name: "help wanted"
  color: "008672"
  description: "Extra attention or contribution is welcome."
- name: "breaking-change"
  color: "b60205"
  description: "Changes that break compatibility or require a major version bump."
- name: "copilot"
  color: "1f6feb"
  description: "Suitable for or assigned to the Copilot coding agent."
