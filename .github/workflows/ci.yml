name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to validate. Defaults to the triggering ref.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to validate. Defaults to the triggering ref.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python test dependencies
        if: hashFiles('tests/requirements.txt') != ''
        run: python -m pip install -r tests/requirements.txt

      # ---------- Static gates ----------

      - name: Version check
        run: python support_scripts/version-check.py

      - name: Cross-reference audit
        run: python support_scripts/cross-reference-audit.py

      - name: MCP config validate (Linux)
        if: runner.os == 'Linux'
        run: bash support_scripts/mcp-config-validate.sh

      - name: MCP config validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./support_scripts/mcp-config-validate.ps1

      # ---------- Smoke pack (Linux only) ----------

      - name: Smoke pack
        if: runner.os == 'Linux'
        env:
          RELEASES_DIR: ${{ github.workspace }}/releases
        run: |
          set -euo pipefail
          bash support_scripts/package-extensions.sh

          # Expect a single combined zip.
          zip_count=$(ls "$RELEASES_DIR"/*.zip 2>/dev/null | wc -l)
          if [ "$zip_count" -ne 1 ]; then
            echo "ERROR: expected exactly 1 zip in $RELEASES_DIR, found $zip_count"
            ls -la "$RELEASES_DIR"
            exit 1
          fi

          bundle_zip="$RELEASES_DIR/fx-to-dotnet.zip"
          if [ ! -f "$bundle_zip" ]; then echo "ERROR: combined bundle zip not produced at $bundle_zip"; ls -la "$RELEASES_DIR"; exit 1; fi
          echo "Found: $bundle_zip"

          tmp=$(mktemp -d)
          unzip -q "$bundle_zip" -d "$tmp/bundle"

          test -f "$tmp/bundle/fx-to-dotnet/extension.yml" || { echo "ERROR: extension.yml not at fx-to-dotnet/ in bundle"; exit 1; }
          test -f "$tmp/bundle/fx-to-dotnet/preset.yml"    || { echo "ERROR: preset.yml not at fx-to-dotnet/ in bundle"; exit 1; }
          echo "OK: combined zip has correct layout"

      # ---------- Test suite (conditional on tests/ existing) ----------

      - name: Pytest (structural + scripts)
        if: hashFiles('tests/structural/**', 'tests/scripts/**') != ''
        run: pytest tests/structural tests/scripts -n auto --maxfail=1 --junitxml=junit-structural-scripts.xml

      - name: Pytest (runtime)
        if: hashFiles('tests/runtime/**') != ''
        run: pytest tests/runtime -n auto --junitxml=junit-runtime.xml

      - name: Set up Pester (Windows)
        if: runner.os == 'Windows' && hashFiles('tests/scripts/Scripts.Tests.ps1') != ''
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [Version]'5.0.0' })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0 -Scope CurrentUser
          }

      - name: Pester (Windows)
        if: runner.os == 'Windows' && hashFiles('tests/scripts/Scripts.Tests.ps1') != ''
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/scripts/Scripts.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'JUnitXml'
          $cfg.TestResult.OutputPath = 'junit-pester.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload junit test reports
        if: always() && hashFiles('junit-*.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-${{ matrix.os }}
          path: junit-*.xml
          if-no-files-found: ignore
