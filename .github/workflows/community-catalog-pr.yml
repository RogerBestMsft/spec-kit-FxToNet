name: Community Catalog PR

# Opens a PR against github/spec-kit to update the community catalog entries
# for the fx-to-dotnet extension and fx-to-dotnet-sdd preset.
#
# Triggers:
#   - workflow_dispatch: manual run with an explicit tag (e.g. v1.2.3)
#   - workflow_call:     invoked by release.yml after the publish-approval gate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the community catalog (e.g. v1.0.0).'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish to the community catalog (e.g. v1.0.0).'
        required: true
        type: string
    secrets:
      SPECKIT_CATALOG_TOKEN:
        description: 'PAT with permission to fork/PR github/spec-kit.'
        required: false

permissions:
  contents: read

concurrency:
  group: community-catalog-pr-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  catalog-pr:
    name: Open community catalog PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG}"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: resolved tag '$tag' is not in v MAJOR.MINOR.PATCH form."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${tag}"

      - name: Check for catalog token
        id: token
        env:
          TOKEN: ${{ secrets.SPECKIT_CATALOG_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "SPECKIT_CATALOG_TOKEN is not set; skipping catalog PR step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repo (for catalog generator)
        if: steps.token.outputs.skip == 'false'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          path: fx2dotnet

      - name: Checkout github/spec-kit
        if: steps.token.outputs.skip == 'false'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: github/spec-kit
          token: ${{ secrets.SPECKIT_CATALOG_TOKEN }}
          path: spec-kit

      - name: Set up Python
        if: steps.token.outputs.skip == 'false'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'

      - name: Generate catalog entries
        if: steps.token.outputs.skip == 'false'
        run: |
          python fx2dotnet/support_scripts/generate-catalog.py > catalog-entries.json
          cat catalog-entries.json

      - name: Merge entries into community catalogs
        if: steps.token.outputs.skip == 'false'
        shell: python
        run: |
          import json, pathlib, sys

          entries = json.loads(pathlib.Path("catalog-entries.json").read_text(encoding="utf-8"))

          def merge(catalog_path: pathlib.Path, new_items: list[dict]) -> None:
              data = []
              if catalog_path.exists():
                  try:
                      data = json.loads(catalog_path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      print(f"WARNING: {catalog_path} is not valid JSON; replacing with new array")
                      data = []
              if not isinstance(data, list):
                  print(f"ERROR: {catalog_path} is not a JSON array (got {type(data).__name__})")
                  sys.exit(1)
              by_id = {e.get("id"): i for i, e in enumerate(data) if isinstance(e, dict)}
              for item in new_items:
                  i = by_id.get(item["id"])
                  if i is None:
                      data.append(item)
                  else:
                      data[i] = item
              catalog_path.parent.mkdir(parents=True, exist_ok=True)
              catalog_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          base = pathlib.Path("spec-kit")
          merge(base / "extensions" / "catalog.community.json", entries.get("extensions", []))
          merge(base / "presets"    / "catalog.community.json", entries.get("presets",    []))
          print("Catalog files updated.")

      - name: Open pull request against github/spec-kit
        if: steps.token.outputs.skip == 'false'
        working-directory: spec-kit
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_CATALOG_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.resolve.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="update-fx-to-dotnet-${TAG}"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes to publish; skipping PR."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -A
          git commit -m "chore(catalog): update fx-to-dotnet to ${TAG}"

          # Fork github/spec-kit into the token owner's account (no-op if it already
          # exists), push the branch to that fork, and open a cross-repo PR.
          gh repo fork github/spec-kit --clone=false --remote=false
          owner="$(gh api user --jq .login)"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${owner}/spec-kit.git" \
            "HEAD:${branch}"

          body="$(printf '%s\n' \
            "Updates the community catalog entries for the \`fx-to-dotnet\` extension and" \
            "\`fx-to-dotnet-sdd\` preset to **${TAG}**." \
            "" \
            "- Release: ${RELEASE_URL}" \
            "- Verified: \`false\` (owner can flip after smoke install)." \
            "" \
            "Generated automatically by the \`community-catalog-pr.yml\` workflow in" \
            "\`${SOURCE_REPO}\`.")"

          gh pr create \
            --repo github/spec-kit \
            --base main \
            --head "${owner}:${branch}" \
            --title "chore(catalog): update fx-to-dotnet to ${TAG}" \
            --body "${body}"
