# Provisions the environment the GitHub Copilot coding agent uses to work on this repo.
# GitHub runs the job named exactly `copilot-setup-steps` before the agent starts, so the
# agent can run the same gates as CI (version-check, cross-reference-audit, pytest, Pester)
# and open a PR that is already green. Keep these steps in sync with .github/workflows/ci.yml.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job id MUST be `copilot-setup-steps` for GitHub to pick it up.
  copilot-setup-steps:
    name: Copilot setup steps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Install Pester (PowerShell tests)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [Version]'5.0.0' })) {
            Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0 -Scope CurrentUser
          }
