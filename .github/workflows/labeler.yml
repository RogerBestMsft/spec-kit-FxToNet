# Applies `area:` labels to pull requests based on the changed file paths in .github/labeler.yml.
name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label PR by path
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels
        uses: actions/labeler@f1a63e87db0c6baf19c5713083f8d00d789ca184 # v6
        with:
          sync-labels: true
