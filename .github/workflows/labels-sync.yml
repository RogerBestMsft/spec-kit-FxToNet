# Syncs the repo's labels to the canonical taxonomy in .github/labels.yml.
name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Sync labels
        uses: EndBug/label-sync@9e7b9e132c14c20e0a3d2269b12f0ab39623e38b # main
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
