name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0). Leave blank to use the current version from fx-to-dotnet/extension.yml. Will create a draft release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse all CI gates (static checks + smoke pack + test suite when present).
  ci:
    uses: ./.github/workflows/ci.yml

  version-equality:
    name: Verify tag matches manifest versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag:     ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version & tag
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "${version}" ]; then
              version=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
                | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
              echo "No version input provided; defaulting to extension.yml version: ${version}"
            fi
            tag="v${version}"
          else
            tag="${GITHUB_REF##*/}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      - name: Assert tag format and manifest equality
        shell: bash
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$VERSION' is not semver MAJOR.MINOR.PATCH"
            exit 1
          fi

          ext_ver=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          preset_ver=$(grep -E '^\s+version:' presets/fx-to-dotnet-sdd/preset.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')

          echo "tag=$VERSION extension=$ext_ver preset=$preset_ver"

          if [ "$ext_ver" != "$VERSION" ] || [ "$preset_ver" != "$VERSION" ]; then
            echo "ERROR: version mismatch (tag=$VERSION extension=$ext_ver preset=$preset_ver)"
            echo "Run support_scripts/bump-version.sh $VERSION and bump preset.yml manually before tagging."
            exit 1
          fi

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [ci, version-equality]
    steps:
      - uses: actions/checkout@v4

      - name: Package extension and preset
        env:
          RELEASES_DIR: ${{ github.workspace }}/releases
        run: bash support_scripts/package-extensions.sh

      - name: Compute SHA-256 sums
        working-directory: releases
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: releases/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, version-equality]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-equality.outputs.tag }}
          name: Release ${{ needs.version-equality.outputs.tag }}
          files: |
            releases/fx-to-dotnet-*.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true

  # Note: the community catalog PR is now handled by the dedicated
  # `community-catalog-pr.yml` workflow, which is triggered automatically
  # via `workflow_run` on successful tag-push releases (or manually via
  # workflow_dispatch).
