name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to release from. Defaults to the triggering ref.'
        required: false
        type: string
        default: ''
      version:
        description: 'Version to release (e.g. 1.0.0). Leave blank to use the current version from fx-to-dotnet/extension.yml.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse all CI gates (static checks + smoke pack + test suite when present).
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  version-equality:
    name: Verify tag matches manifest versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag:     ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.ref }}

      - name: Compute version & tag
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "${version}" ]; then
              version=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
                | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
              echo "No version input provided; defaulting to extension.yml version: ${version}"
            fi
            tag="v${version}"
          else
            tag="${GITHUB_REF##*/}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      - name: Assert tag format and manifest equality
        shell: bash
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$VERSION' is not semver MAJOR.MINOR.PATCH"
            exit 1
          fi

          ext_ver=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          preset_ver=$(grep -E '^\s+version:' fx-to-dotnet/preset.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')

          echo "tag=$VERSION extension=$ext_ver preset=$preset_ver"

          if [ "$ext_ver" != "$VERSION" ] || [ "$preset_ver" != "$VERSION" ]; then
            echo "ERROR: version mismatch (tag=$VERSION extension=$ext_ver preset=$preset_ver)"
            echo "Run support_scripts/bump-version.sh $VERSION and bump preset.yml manually before tagging."
            exit 1
          fi

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [ci, version-equality]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.ref }}

      - name: Package extension and preset
        env:
          RELEASES_DIR: ${{ github.workspace }}/releases
        run: bash support_scripts/package-extensions.sh

      - name: Compute SHA-256 sums
        working-directory: releases
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-artifacts
          path: releases/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, version-equality]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (for tag creation)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: releases

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.version-equality.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping creation."
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping creation."
          else
            echo "Creating annotated tag ${TAG} at ${target_sha}"
            git tag -a "${TAG}" -m "Release ${TAG}" "${target_sha}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version-equality.outputs.tag }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
        run: |
          set -euo pipefail

          # Fail loudly if an expected asset is missing (replaces fail_on_unmatched_files).
          for asset in releases/fx-to-dotnet.zip releases/SHA256SUMS.txt; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: expected release asset '$asset' not found"
              exit 1
            fi
          done

          args=(
            "$TAG"
            releases/fx-to-dotnet.zip
            releases/SHA256SUMS.txt
            --title "Release $TAG"
            --generate-notes
            --verify-tag
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=( --prerelease )
          fi

          gh release create "${args[@]}"

  # Note: publishing to the spec-kit community catalog is handled by the
  # standalone `community-catalog-pr.yml` workflow, triggered manually via
  # workflow_dispatch with the release tag.
