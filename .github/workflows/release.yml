name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0). Leave blank to use the current version from fx-to-dotnet/extension.yml. Will create a draft release.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse all CI gates (static checks + smoke pack + test suite when present).
  ci:
    uses: ./.github/workflows/ci.yml

  version-equality:
    name: Verify tag matches manifest versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag:     ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version & tag
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "${version}" ]; then
              version=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
                | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
              echo "No version input provided; defaulting to extension.yml version: ${version}"
            fi
            tag="v${version}"
          else
            tag="${GITHUB_REF##*/}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"

      - name: Assert tag format and manifest equality
        shell: bash
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$VERSION' is not semver MAJOR.MINOR.PATCH"
            exit 1
          fi

          ext_ver=$(grep -E '^\s+version:' fx-to-dotnet/extension.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')
          preset_ver=$(grep -E '^\s+version:' fx-to-dotnet/preset.yml | head -1 \
            | sed -E 's/.*version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/')

          echo "tag=$VERSION extension=$ext_ver preset=$preset_ver"

          if [ "$ext_ver" != "$VERSION" ] || [ "$preset_ver" != "$VERSION" ]; then
            echo "ERROR: version mismatch (tag=$VERSION extension=$ext_ver preset=$preset_ver)"
            echo "Run support_scripts/bump-version.sh $VERSION and bump preset.yml manually before tagging."
            exit 1
          fi

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [ci, version-equality]
    steps:
      - uses: actions/checkout@v4

      - name: Package extension and preset
        env:
          RELEASES_DIR: ${{ github.workspace }}/releases
        run: bash support_scripts/package-extensions.sh

      - name: Compute SHA-256 sums
        working-directory: releases
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: releases/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package, version-equality]
    permissions:
      contents: write
    steps:
      - name: Checkout (for tag creation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: releases

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.version-equality.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping creation."
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping creation."
          else
            echo "Creating annotated tag ${TAG} at ${GITHUB_SHA}"
            git tag -a "${TAG}" -m "Release ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-equality.outputs.tag }}
          name: Release ${{ needs.version-equality.outputs.tag }}
          files: |
            releases/fx-to-dotnet-*.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true

  update-changelog:
    name: Update CHANGELOG.md from release notes
    # Only run for real tag pushes — workflow_dispatch creates a draft
    # release whose body is not yet finalized.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [release, version-equality]
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepend release notes to CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version-equality.outputs.tag }}
          VERSION: ${{ needs.version-equality.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Fetch release notes for this tag (auto-generated by softprops/action-gh-release)
          notes_file="$(mktemp)"
          gh release view "${TAG}" --repo "${REPO}" --json body --jq .body > "${notes_file}"

          if [ ! -s "${notes_file}" ]; then
            echo "Release body for ${TAG} is empty; nothing to add."
            exit 0
          fi

          date_iso="$(date -u +%Y-%m-%d)"
          repo_url="https://github.com/${REPO}"

          entry_file="$(mktemp)"
          {
            echo "## [${VERSION}] - ${date_iso}"
            echo
            echo "[Release notes](${repo_url}/releases/tag/${TAG})"
            echo
            cat "${notes_file}"
            echo
          } > "${entry_file}"

          if [ ! -f CHANGELOG.md ]; then
            {
              echo "# Changelog"
              echo
              echo "<!-- RELEASES -->"
              echo
            } > CHANGELOG.md
          fi

          # Idempotency: skip if this version already has a section.
          if grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already contains an entry for ${VERSION}; skipping."
            exit 0
          fi

          marker="<!-- RELEASES -->"
          if grep -qF "${marker}" CHANGELOG.md; then
            # Insert after the marker line.
            awk -v marker="${marker}" -v entry_file="${entry_file}" '
              { print }
              $0 == marker && !done {
                print ""
                while ((getline line < entry_file) > 0) print line
                close(entry_file)
                done = 1
              }
            ' CHANGELOG.md > CHANGELOG.md.new
          else
            # No marker: prepend after the first H1 if present, else at top.
            if head -1 CHANGELOG.md | grep -qE '^# '; then
              {
                head -1 CHANGELOG.md
                echo
                cat "${entry_file}"
                tail -n +2 CHANGELOG.md
              } > CHANGELOG.md.new
            else
              cat "${entry_file}" CHANGELOG.md > CHANGELOG.md.new
            fi
          fi
          mv CHANGELOG.md.new CHANGELOG.md

          echo "----- CHANGELOG.md (head) -----"
          head -40 CHANGELOG.md
          echo "-------------------------------"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "No CHANGELOG.md changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${{ needs.version-equality.outputs.tag }} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  # Note: the community catalog PR is handled by the dedicated
  # `community-catalog-pr.yml` workflow, which is triggered manually
  # via workflow_dispatch with the release tag.
