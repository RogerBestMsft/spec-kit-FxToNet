schema_version: "1.0"

workflow:
  id: "library-plan"
  name: "Library Plan"
  version: "0.3.0"
  author: "Microsoft"
  description: "Document all non-web library projects, plan migration order, and orchestrate library migration for each"

requires:
  speckit_version: ">=0.7.2"

inputs:
  solution:
    type: string
    required: true
    prompt: "Path to the .sln or .slnx solution file"
  target_framework:
    type: string
    default: "net10.0"
    prompt: "Target framework (e.g. net10.0, net9.0)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  - id: migrate-libraries
    type: do-while
    condition: "{{ steps.library-gate.output.choice == 'continue' }}"
    max_iterations: 50
    steps:
      - id: multitarget-library
        command: speckit.fx-to-dotnet.multitarget-migrate
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: fix-library
        command: speckit.fx-to-dotnet.fix
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: library-gate
        type: gate
        message: "Library migration step complete. Build validated. Continue to next library?"
        options: [continue, done, reject]
        on_reject: abort

  - id: review-libraries
    type: gate
    message: "All library projects migrated. Review .fx-to-dotnet/library-plan.md before proceeding to web app migration."
    options: [approve, reject]
    on_reject: abort
