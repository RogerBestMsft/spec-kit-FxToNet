schema_version: "1.0"

workflow:
  id: "library-update"
  name: "Library Update (single library)"
  version: "0.4.0"
  author: "Microsoft"
  description: "Multitarget a single non-web library project to the modern target framework and run a fix-loop until the build succeeds. Modeled on the per-library section of the library-plan workflow. Used per-library by library-plan and dispatched per [MIG-*] task by the before_implement hook."

requires:
  speckit_version: ">=0.7.2"

inputs:
  project:
    type: string
    required: true
    prompt: "Path to the .csproj/.vbproj/.fsproj for the library to multitarget"
  target_framework:
    type: string
    default: "net10.0"
    prompt: "Target framework (e.g. net10.0, net9.0)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  - id: multitarget
    command: speckit.fx-to-dotnet.multitarget-migrate
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.project }} {{ inputs.target_framework }}"

  - id: fix-loop
    type: do-while
    condition: "{{ steps.fix-gate.output.choice == 'retry' }}"
    max_iterations: 10
    steps:
      - id: fix
        command: speckit.fx-to-dotnet.fix
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.project }}"

      - id: fix-gate
        type: gate
        message: "Build attempt complete for {{ inputs.project }}. Continue (build succeeded), retry (apply more fixes), or abort?"
        options: [continue, retry, abort]
        on_reject: abort

  - id: review-library
    type: gate
    message: "Library {{ inputs.project }} multitarget + fix complete. Approve before the outer caller proceeds."
    options: [approve, reject]
    on_reject: abort
