schema_version: "1.0"

workflow:
  id: "library-update"
  name: "Library Update"
  version: "0.3.0"
  author: "Microsoft"
  description: "Multitarget a single library project to modern .NET with build validation"

requires:
  speckit_version: ">=0.7.2"

inputs:
  project:
    type: string
    required: true
    prompt: "Path to the project file (.csproj, .vbproj, or .fsproj)"
  solution:
    type: string
    required: false
    prompt: "Path to the solution file (optional, for build context)"
  target_framework:
    type: string
    default: "net10.0"
    prompt: "Target framework (e.g. net10.0, net9.0)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  - id: multitarget
    command: speckit.fx-to-dotnet.multitarget-migrate
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.project }}"

  - id: build-fix
    command: speckit.fx-to-dotnet.fix
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution | default(inputs.project) }}"

  - id: review-migration
    type: gate
    message: "Library multitarget migration complete. Review build results and files changed."
    options: [approve, reject]
    on_reject: abort
