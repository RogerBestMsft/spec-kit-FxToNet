schema_version: "1.0"

workflow:
  id: "migrate-all"
  name: "Migrate All"
  version: "0.3.0"
  author: "Microsoft"
  description: "Run the full migration sequence end-to-end — from assessment through web app migration"

requires:
  speckit_version: ">=0.7.2"

inputs:
  solution:
    type: string
    required: true
    prompt: "Path to the .sln or .slnx solution file"
  target_framework:
    type: string
    default: "net10.0"
    prompt: "Target framework (e.g. net10.0, net9.0)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  # Phase 1: Assessment and Planning (read-only)
  - id: assess-and-plan
    command: speckit.fx-to-dotnet.assess-and-plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-assessment
    type: gate
    message: "Assessment and plan complete. No code changes made. Review .fx-to-dotnet/plan.md before SDK normalization."
    options: [approve, reject]
    on_reject: abort

  # Phase 2: SDK Normalization
  - id: sdk-normalize
    command: speckit.fx-to-dotnet.sdk-normalize
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-sdk
    type: gate
    message: "SDK normalization complete. Review converted projects before package modernization."
    options: [approve, reject]
    on_reject: abort

  # Phase 3: Package Modernization (read-only)
  - id: package-modernize
    command: speckit.fx-to-dotnet.package-modernize
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-package-plan
    type: gate
    message: "Package modernization plan ready. Review .fx-to-dotnet/package-updates.md before applying updates."
    options: [approve, reject]
    on_reject: abort

  # Phase 4: Package Updates
  - id: package-update
    command: speckit.fx-to-dotnet.package-update
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-packages
    type: gate
    message: "Package updates complete. Review results before library migration."
    options: [approve, reject]
    on_reject: abort

  # Phase 5: Library Migration
  - id: library-plan
    command: speckit.fx-to-dotnet.library-plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-libraries
    type: gate
    message: "Library migration complete. Approve to continue to web app migration, or skip if no web-app-host projects."
    options: [approve, skip]
    on_reject: skip

  # Phase 6: Web App Migration (conditional)
  - id: web-migration-branch
    type: if
    condition: "{{ steps.review-libraries.output.choice == 'approve' }}"
    then:
      - id: web-app-migration
        command: speckit.fx-to-dotnet.web-app-migration
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: review-web
        type: gate
        message: "Web app migration complete. Review .fx-to-dotnet/completion.md for final results."
        options: [approve, reject]
        on_reject: abort
