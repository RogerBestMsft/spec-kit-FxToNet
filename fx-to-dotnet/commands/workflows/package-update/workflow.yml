schema_version: "1.0"

workflow:
  id: "package-update"
  name: "Package Update"
  version: "0.3.0"
  author: "Microsoft"
  description: "Execute chunked package updates from the package modernization plan with build validation"

requires:
  speckit_version: ">=0.7.2"

inputs:
  solution:
    type: string
    required: true
    prompt: "Path to the .sln or .slnx solution file"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  - id: update-chunks
    type: do-while
    condition: "{{ steps.chunk-gate.output.choice == 'continue' }}"
    max_iterations: 30
    steps:
      - id: apply-chunk
        command: speckit.fx-to-dotnet.update-packages
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: build-fix-chunk
        command: speckit.fx-to-dotnet.fix
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: chunk-gate
        type: gate
        message: "Package update chunk complete. Build validated. Continue to next chunk?"
        options: [continue, done, reject]
        on_reject: abort

  - id: review-updates
    type: gate
    message: "All package update chunks applied. Review results before proceeding to library migration."
    options: [approve, reject]
    on_reject: abort
