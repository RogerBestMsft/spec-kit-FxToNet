schema_version: "1.0"

workflow:
  id: "sdk-normalize"
  name: "SDK Normalize"
  version: "0.3.0"
  author: "Microsoft"
  description: "Convert all legacy project files to SDK-style format without changing target framework"

requires:
  speckit_version: ">=0.7.2"

inputs:
  solution:
    type: string
    required: true
    prompt: "Path to the .sln or .slnx solution file"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  - id: detect
    command: speckit.fx-to-dotnet.detect
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: convert-layers
    type: do-while
    condition: "{{ steps.layer-gate.output.choice == 'continue' }}"
    max_iterations: 20
    steps:
      - id: convert-layer
        command: speckit.fx-to-dotnet.convert
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: build-fix-layer
        command: speckit.fx-to-dotnet.fix
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.solution }}"

      - id: layer-gate
        type: gate
        message: "Layer conversion complete. Build validated. Continue to next dependency layer?"
        options: [continue, done, reject]
        on_reject: abort

  - id: review-normalize
    type: gate
    message: "All layers converted to SDK-style format. Review before proceeding to package modernization."
    options: [approve, reject]
    on_reject: abort
