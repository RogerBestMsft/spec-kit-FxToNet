schema_version: "1.0"

workflow:
  id: "web-app-migration"
  name: "Web App Migration"
  version: "0.3.0"
  author: "Microsoft"
  description: "Migrate ASP.NET Framework web application(s) to ASP.NET Core with full verification"

requires:
  speckit_version: ">=0.7.2"

inputs:
  solution:
    type: string
    required: true
    prompt: "Path to the .sln or .slnx solution file"
  target_framework:
    type: string
    default: "net10.0"
    prompt: "Target framework (e.g. net10.0, net9.0)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  # Phase 1: Multitarget any remaining web-adjacent projects
  - id: multitarget-remaining
    command: speckit.fx-to-dotnet.multitarget-migrate
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: fix-multitarget
    command: speckit.fx-to-dotnet.fix
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-multitarget
    type: gate
    message: "Web-adjacent projects multitargeted. Build validated. Continue to route inventory?"
    options: [approve, reject]
    on_reject: abort

  # Phase 2: Route Inventory
  - id: inventory
    command: speckit.fx-to-dotnet.inventory
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-inventory
    type: gate
    message: "Route inventory complete. Review endpoints, controllers, and auth requirements before web migration."
    options: [approve, reject]
    on_reject: abort

  # Phase 3: Web Migration
  - id: web-migrate
    command: speckit.fx-to-dotnet.web-migrate
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: fix-web
    command: speckit.fx-to-dotnet.fix
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-web
    type: gate
    message: "Web migration complete. Build validated. Continue to verification?"
    options: [approve, reject]
    on_reject: abort

  # Phase 4: Final build verification
  - id: verify
    command: speckit.fx-to-dotnet.fix
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.solution }}"

  - id: review-complete
    type: gate
    message: "Migration verification complete. Review the build output and run additional fix iterations as needed."
    options: [approve, reject]
    on_reject: abort
