schema_version: "1.0"
preset:
  id: "fx-to-dotnet-sdd"
  name: ".NET Framework Migration SDD Preset"
  version: "0.9.0"
  description: "Companion preset for the fx-to-dotnet extension (>= 0.9.0). Overrides the core speckit.specify, speckit.plan, speckit.tasks, speckit.implement, and plan-template so migration content is owned end-to-end by fx-to-dotnet hooks and core never emits competing migration analysis, migration tasks, or migration execution behavior. Layer 4 of the tight integration plan; opt-in."
  author: "Microsoft"
  repository: "https://github.com/AzureAD/fx-to-dotnet-extensions"
  license: "MIT"

requires:
  speckit_version: ">=0.7.2"
  extensions:
    - id: "fx-to-dotnet"
      version: ">=0.9.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "templates/commands/specify.md"
      description: "Specify override — adds .NET Framework migration context detection"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.plan"
      file: "templates/commands/plan.md"
      description: "Plan override — defers migration analysis and plan ownership to fx-to-dotnet hooks"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "templates/commands/tasks.md"
      description: "Tasks override — defers migration task emission to fx-to-dotnet hooks"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.implement"
      file: "templates/commands/implement.md"
      description: "Implement override — skips [MIG-*] tasks owned by fx-to-dotnet hooks"
      replaces: "speckit.implement"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan template override — includes migration phase placeholders"
      replaces: "plan-template"

tags:
  - "dotnet"
  - "migration"
  - "sdd"
  - "preset"
