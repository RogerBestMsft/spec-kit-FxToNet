schema_version: "1.0"

workflow:
  id: "sdd-full-lifecycle"
  name: "SDD Full Lifecycle"
  version: "0.3.0"
  author: "Microsoft"
  description: "Run the complete SDD lifecycle end-to-end — specify, plan, tasks, and implement — with integrated .NET Framework migration at every phase"

requires:
  speckit_version: ">=0.7.2"
  commands:
    - "speckit.specify"
    - "speckit.plan"
    - "speckit.tasks"
    - "speckit.implement"

inputs:
  feature_description:
    type: string
    required: true
    prompt: "Describe the feature to build (include solution path for migration context)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  # Phase 1: Specify (+ migration detection via specify-hook)
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_description }}"

  - id: review-spec
    type: gate
    message: "Feature specification complete. Review spec.md and any migration context before planning."
    options: [approve, reject]
    on_reject: abort

  # Phase 2: Plan (+ migration assessment via plan-hook)
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_description }}"

  - id: review-plan
    type: gate
    message: "Implementation plan and migration plan complete. Review before task generation."
    options: [approve, reject]
    on_reject: abort

  # Phase 3: Tasks (+ [MIG] task generation via tasks-hook)
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_description }}"

  - id: review-tasks
    type: gate
    message: "Task breakdown complete. Review tasks.md including [MIG] migration tasks before implementation."
    options: [approve, reject]
    on_reject: abort

  # Phase 4: Implement (+ migration execution via implement-hook, verification via verify-hook)
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_description }}"

  - id: review-complete
    type: gate
    message: "Implementation and migration complete. Review .fx-to-dotnet/completion.md for final results."
    options: [approve, reject]
    on_reject: abort
