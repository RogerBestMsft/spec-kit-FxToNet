schema_version: "1.0"

workflow:
  id: "sdd-plan-to-tasks"
  name: "SDD Plan to Tasks"
  version: "0.3.0"
  author: "Microsoft"
  description: "Generate implementation plan and task breakdown using SDD lifecycle commands — includes automatic .NET Framework migration planning and [MIG] task generation"

requires:
  speckit_version: ">=0.7.2"
  commands:
    - "speckit.plan"
    - "speckit.tasks"

inputs:
  args:
    type: string
    required: false
    prompt: "Additional context for planning and task generation (optional)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  # Phase 1: Plan (+ migration assessment via plan-hook)
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.args }}"

  - id: review-plan
    type: gate
    message: "Implementation plan complete. Review plan.md and any .NET migration plan before task generation."
    options: [approve, reject]
    on_reject: abort

  # Phase 2: Tasks (+ [MIG] task generation via tasks-hook)
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.args }}"

  - id: review-tasks
    type: gate
    message: "Task breakdown complete. Review tasks.md including any [MIG]-tagged migration tasks before implementation."
    options: [approve, reject]
    on_reject: abort
