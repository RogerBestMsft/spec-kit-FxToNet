schema_version: "1.0"

workflow:
  id: "sdd-tasks-to-implement"
  name: "SDD Tasks to Implement"
  version: "0.3.0"
  author: "Microsoft"
  description: "Generate tasks and execute implementation using SDD lifecycle commands — includes automatic [MIG] task generation, migration execution, and post-migration verification"

requires:
  speckit_version: ">=0.7.2"
  commands:
    - "speckit.tasks"
    - "speckit.implement"

inputs:
  args:
    type: string
    required: false
    prompt: "Additional context for task generation and implementation (optional)"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. copilot, claude, gemini)"

steps:
  # Phase 1: Tasks (+ [MIG] task generation via tasks-hook)
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.args }}"

  - id: review-tasks
    type: gate
    message: "Task breakdown complete. Review tasks.md including any [MIG]-tagged migration tasks before implementation."
    options: [approve, reject]
    on_reject: abort

  # Phase 2: Implement (+ migration execution via implement-hook, verification via verify-hook)
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.args }}"

  - id: review-complete
    type: gate
    message: "Implementation complete. Review results including any migration verification in .fx-to-dotnet/completion.md."
    options: [approve, reject]
    on_reject: abort
